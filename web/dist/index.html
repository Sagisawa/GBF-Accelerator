    <title>GBF-Accelerator 控制台</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('gbf_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html { background-color: #eef2f7; }
      html.dark { background-color: #0a101c; }
    </style>
